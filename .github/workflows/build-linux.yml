name: Build Linux Binary

on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      version:
        description: Tag/release a compilar (ej. v1.2.3). Si se deja vacio usa el tag del evento.
        required: false

jobs:
  linux-binary:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: ${{ inputs.version || github.event.release.tag_name || github.ref_name }}

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y python3-tk

      - name: Install build dependencies
        run: |
          python -m pip install --upgrade pip
          pip install requests pyinstaller

      - name: Build executable
        run: |
          pyinstaller --noconfirm --onefile --name hamactivity_bridge radioaward_bridge.py

      - name: Version artifact
        env:
          VERSION: ${{ inputs.version || github.event.release.tag_name || github.ref_name }}
        run: |
          mv dist/hamactivity_bridge "dist/hamactivity_bridge-linux-$VERSION"

      - name: Package artifact
        env:
          VERSION: ${{ inputs.version || github.event.release.tag_name || github.ref_name }}
        run: |
          tar -C dist -czf "dist/hamactivity_bridge-linux-$VERSION.tar.gz" "hamactivity_bridge-linux-$VERSION"

      - name: Upload release asset
        env:
          VERSION: ${{ inputs.version || github.event.release.tag_name || github.ref_name }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          if [ -z "$VERSION" ]; then
            echo "VERSION no definido." >&2
            exit 1
          fi
          gh release upload "$VERSION" "dist/hamactivity_bridge-linux-$VERSION.tar.gz" --clobber
